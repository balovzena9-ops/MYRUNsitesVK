<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYSKIY RUNSTORE</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080004;--surface:#120007;--surface-2:#1c0010;--border:rgba(255,255,255,0.07);--text:#fff;--text-dim:rgba(255,255,255,0.62);--text-mute:rgba(255,255,255,0.38);--accent:#a8004d;--accent-bright:#ff2e6e;--accent-glow:rgba(168,0,77,0.45);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden;background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(168,0,77,0.18) 0%,transparent 55%),radial-gradient(ellipse 50% 40% at 95% 100%,rgba(168,0,77,0.09) 0%,transparent 60%);background-attachment:fixed;}
.preloader{position:fixed;inset:0;background:#080004;display:flex;align-items:center;justify-content:center;z-index:10000;transition:opacity 0.6s ease,visibility 0.6s ease;background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(168,0,77,0.28) 0%,transparent 55%),radial-gradient(ellipse 50% 40% at 95% 100%,rgba(168,0,77,0.12) 0%,transparent 60%);}
.preloader.hidden{opacity:0;visibility:hidden;}
.preloader-content{display:flex;flex-direction:column;align-items:center;gap:32px;padding:24px;}
.preloader-logo{width:84px;height:84px;border-radius:22px;object-fit:cover;background:#1c0010;box-shadow:0 12px 60px rgba(255,46,110,0.55);animation:preloaderFloat 2s ease-in-out infinite;}
@keyframes preloaderFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-8px) scale(1.04);}}
.preloader-brand{font-size:14px;font-weight:900;letter-spacing:3px;color:rgba(255,255,255,0.85);text-transform:uppercase;text-align:center;}
.preloader-brand span{background:linear-gradient(135deg,#ff2e6e,#a8004d);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.preloader-bar-wrap{width:280px;height:3px;border-radius:3px;background:rgba(255,255,255,0.06);overflow:hidden;position:relative;}
.preloader-bar{position:absolute;left:0;top:0;bottom:0;width:0%;border-radius:3px;background:linear-gradient(90deg,#ff2e6e,#a8004d);box-shadow:0 0 20px rgba(255,46,110,0.8);transition:width 0.35s cubic-bezier(0.22,1,0.36,1);}
.preloader-percent{font-size:12px;font-weight:700;letter-spacing:2.5px;color:rgba(255,255,255,0.5);text-transform:uppercase;font-variant-numeric:tabular-nums;}
.settings-screen{position:fixed;inset:0;z-index:9999;background:#080004;display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity 0.5s ease,visibility 0.5s ease;background-image:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(168,0,77,0.22) 0%,transparent 55%);opacity:0;visibility:hidden;overflow-y:auto;}
.settings-screen.visible{opacity:1;visibility:visible;}
.settings-box{width:100%;max-width:460px;padding:36px 32px;background:linear-gradient(180deg,rgba(30,0,16,0.75),rgba(15,0,8,0.9));border:1px solid rgba(255,46,110,0.22);border-radius:24px;box-shadow:0 40px 100px rgba(0,0,0,0.65),inset 0 1px 0 rgba(255,255,255,0.05);animation:settingsIn 0.5s cubic-bezier(0.22,1,0.36,1);margin:auto;}
@keyframes settingsIn{from{opacity:0;transform:translateY(24px) scale(0.95);}to{opacity:1;transform:translateY(0) scale(1);}}
.settings-title{font-size:22px;font-weight:900;margin-bottom:6px;letter-spacing:-0.4px;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.6));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.settings-sub{font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:22px;letter-spacing:0.2px;}
.settings-group{margin-bottom:18px;}
.settings-label{font-size:11px;font-weight:700;letter-spacing:1.8px;color:rgba(255,255,255,0.45);text-transform:uppercase;margin-bottom:8px;display:block;}
.settings-options{display:flex;gap:8px;flex-wrap:wrap;}
.settings-option{flex:1;min-width:56px;padding:11px 14px;border-radius:12px;border:1.5px solid rgba(255,255,255,0.09);background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.72);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;transition:all 0.22s cubic-bezier(0.22,1,0.36,1);text-align:center;}
.settings-option:hover{border-color:rgba(255,46,110,0.3);background:rgba(255,46,110,0.05);color:#fff;}
.settings-option.selected{border-color:#ff2e6e;background:rgba(255,46,110,0.14);color:#fff;box-shadow:0 0 0 3px rgba(255,46,110,0.18);}
.settings-option-currency{font-size:20px;padding:12px 0;font-weight:900;line-height:1;}
.settings-continue{width:100%;padding:14px;margin-top:12px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff2e6e,#a8004d);color:#fff;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:0.3px;cursor:pointer;transition:all 0.3s cubic-bezier(0.22,1,0.36,1);box-shadow:0 10px 32px rgba(168,0,77,0.42);}
.settings-continue:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,46,110,0.55);}
.settings-continue:active{transform:scale(0.98);}
header{position:sticky;top:0;z-index:100;background:rgba(8,0,4,0.85);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-bottom:1px solid var(--border);}
.header-inner{max-width:1400px;margin:0 auto;padding:12px 28px;display:flex;align-items:center;gap:20px;flex-wrap:wrap;position:relative;}
.brand{display:flex;align-items:center;gap:11px;flex-shrink:0;}
.brand-logo{width:38px;height:38px;border-radius:10px;object-fit:cover;background:var(--surface-2);box-shadow:0 4px 16px rgba(168,0,77,0.35);transition:transform 0.3s ease;}
.brand-logo:hover{transform:scale(1.06);}
.brand-name{font-weight:900;font-size:16px;letter-spacing:1.2px;white-space:nowrap;}
.brand-name span{background:linear-gradient(135deg,var(--accent-bright),var(--accent));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
nav{flex:1;display:flex;gap:3px;flex-wrap:wrap;padding:2px 0;min-width:0;}
nav button{background:transparent;border:none;color:var(--text-dim);font-family:inherit;font-size:12.5px;font-weight:500;padding:7px 12px;border-radius:9px;cursor:pointer;transition:all 0.22s ease;white-space:nowrap;}
nav button:hover{color:var(--text);background:rgba(255,255,255,0.05);}
nav button.active{color:#fff;background:var(--accent);box-shadow:0 4px 22px var(--accent-glow);}
nav button.cart-btn.has-items{background:rgba(255,46,110,0.15);color:#ff8a8a;border:1px solid rgba(255,46,110,0.4);}
.settings-btn{width:38px;height:38px;border-radius:10px;flex-shrink:0;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);color:rgba(255,255,255,0.6);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all 0.25s cubic-bezier(0.22,1,0.36,1);}
.settings-btn:hover{background:rgba(255,46,110,0.15);color:#ff8a8a;border-color:rgba(255,46,110,0.4);transform:rotate(45deg);}
.settings-btn svg{width:18px;height:18px;}
body.iface-mobile nav{display:none;position:absolute;top:100%;left:0;right:0;background:rgba(8,0,4,0.98);backdrop-filter:blur(22px);border-bottom:1px solid var(--border);padding:12px 16px;flex-wrap:wrap;gap:6px;box-shadow:0 12px 32px rgba(0,0,0,0.6);animation:navDrop 0.25s cubic-bezier(0.22,1,0.36,1);}
body.iface-mobile nav.open{display:flex;}
body.iface-mobile nav button{font-size:13px;padding:8px 14px;}
body.iface-mobile .brand{cursor:pointer;}
@keyframes navDrop{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
main{max-width:1400px;margin:0 auto;padding:0 32px;}
.page{display:none;animation:pageIn 0.55s cubic-bezier(0.22,1,0.36,1);}
.page.active{display:block;}
@keyframes pageIn{from{opacity:0;transform:translateY(24px);}to{opacity:1;transform:translateY(0);}}
.page-title{padding:40px 0 8px;font-size:clamp(30px,5vw,52px);font-weight:900;letter-spacing:-1.6px;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.55) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.page-sub{color:var(--text-dim);font-size:15px;margin-bottom:12px;letter-spacing:0.3px;}
.embed{width:100%;border:none;display:block;border-radius:22px;overflow:hidden;margin:22px 0;background:transparent;opacity:0;transform:translateY(16px);animation:embedIn 0.7s cubic-bezier(0.22,1,0.36,1) forwards;}
@keyframes embedIn{to{opacity:1;transform:translateY(0);}}
.embed-news{height:500px;}.embed-train{height:500px;animation-delay:0.05s;}.embed-runway{height:520px;animation-delay:0.1s;}.embed-clock{height:520px;max-width:560px;margin:22px auto;animation-delay:0.15s;}.embed-ai{height:1450px;animation-delay:0.2s;}
.widgets-row{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin:22px 0;}
.widgets-row .embed-os{height:500px;margin:0;background:var(--surface);border:1px solid var(--border);border-radius:22px;animation-delay:0.25s;}
@media(max-width:760px){.widgets-row{grid-template-columns:1fr;}.embed-os{height:420px;}}
.products-section{margin:52px 0 24px;}
.products-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;padding-bottom:18px;margin-bottom:28px;border-bottom:1px solid var(--border);flex-wrap:wrap;}
.products-head h2{font-size:clamp(24px,3.5vw,36px);font-weight:900;letter-spacing:-1px;background:linear-gradient(135deg,#fff 0%,rgba(255,255,255,0.6) 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.products-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;color:var(--accent-bright);margin-bottom:8px;display:block;}
.products-meta{font-size:12.5px;color:var(--text-mute);letter-spacing:1px;font-weight:500;display:flex;gap:20px;flex-wrap:wrap;}
.products-meta span{white-space:nowrap;}
.products-grid-ms{display:grid;grid-template-columns:repeat(2,1fr);gap:26px;}
@media(max-width:860px){.products-grid-ms{grid-template-columns:1fr;}}
.ms-product{position:relative;background:linear-gradient(180deg,rgba(30,0,16,0.55),rgba(15,0,8,0.65));border:1px solid rgba(255,255,255,0.06);border-radius:26px;overflow:hidden;display:flex;flex-direction:column;transition:all 0.4s cubic-bezier(0.22,1,0.36,1);opacity:0;transform:translateY(20px);animation:prodIn 0.6s cubic-bezier(0.22,1,0.36,1) forwards;}
.ms-product:hover{border-color:rgba(255,46,110,0.35);box-shadow:0 24px 56px rgba(168,0,77,0.22),0 0 0 1px rgba(255,46,110,0.12);transform:translateY(-4px);}
.ms-product.not-for-sale{opacity:0.75;}
.ms-product.not-for-sale:hover{transform:none;border-color:rgba(255,255,255,0.06);box-shadow:none;}
@keyframes prodIn{to{opacity:1;transform:translateY(0);}}
.ms-product-image{position:relative;aspect-ratio:1.08/1;overflow:hidden;background:radial-gradient(ellipse at center,rgba(168,0,77,0.18) 0%,transparent 70%);display:flex;align-items:center;justify-content:center;padding:26px;}
.ms-product-image img{width:100%;height:100%;object-fit:contain;transition:transform 0.65s cubic-bezier(0.22,1,0.36,1);filter:drop-shadow(0 16px 40px rgba(0,0,0,0.5));}
.ms-product:hover .ms-product-image img{transform:scale(1.05) translateY(-4px);}
.ms-product.not-for-sale:hover .ms-product-image img{transform:none;}
.ms-product-body{padding:22px 28px 28px;display:flex;flex-direction:column;gap:12px;flex:1;}
.ms-product-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ms-product-name{font-size:23px;font-weight:800;letter-spacing:-0.4px;}
.ms-product-code{font-family:'SF Mono','Courier New',monospace;font-size:11.5px;color:var(--text-dim);letter-spacing:1.8px;padding:3px 9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:7px;font-weight:600;}
.ms-product-badge{font-size:10.5px;font-weight:700;letter-spacing:0.4px;color:#ff9b9b;background:rgba(180,30,30,0.15);border:1px solid rgba(220,60,60,0.3);padding:5px 10px;border-radius:7px;display:inline-block;margin-top:2px;align-self:flex-start;}
.ms-product-price{font-size:28px;font-weight:900;color:#fff;letter-spacing:-0.8px;text-shadow:0 0 26px rgba(255,46,110,0.35);margin-top:4px;display:flex;align-items:baseline;flex-wrap:wrap;gap:6px;}
.ms-product-price small{font-size:15px;font-weight:600;color:var(--text-dim);}
.ms-product-price-note{font-size:10.5px;font-weight:700;color:var(--text-mute);letter-spacing:0.5px;padding:3px 8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.07);border-radius:6px;text-transform:uppercase;}
.ms-product-price.disabled{color:var(--text-mute);font-size:18px;text-shadow:none;}
.ms-product-specs{margin-top:6px;border-top:1px solid rgba(255,255,255,0.06);padding-top:14px;}
.ms-product-specs summary{cursor:pointer;list-style:none;font-size:13px;font-weight:600;color:var(--text-dim);display:flex;align-items:center;justify-content:space-between;padding:4px 0;transition:color 0.2s;user-select:none;}
.ms-product-specs summary::-webkit-details-marker{display:none;}
.ms-product-specs summary:hover{color:#fff;}
.ms-product-specs summary::after{content:'+';font-size:20px;font-weight:300;transition:transform 0.35s cubic-bezier(0.22,1,0.36,1);line-height:1;}
.ms-product-specs[open] summary::after{transform:rotate(45deg);}
.ms-product-specs[open] summary{color:#fff;margin-bottom:14px;}
.ms-product-specs dl{display:flex;flex-direction:column;gap:11px;animation:specOpen 0.35s ease;}
@keyframes specOpen{from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);}}
.ms-product-specs dl > div{display:grid;grid-template-columns:105px 1fr;gap:14px;font-size:13px;line-height:1.55;}
.ms-product-specs dt{color:var(--text-mute);font-weight:600;letter-spacing:0.2px;}
.ms-product-specs dd{color:var(--text-dim);}
.btn-add-cart{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:10px;width:100%;margin-top:16px;padding:15px 22px;border:none;border-radius:14px;cursor:pointer;font-family:inherit;font-size:14.5px;font-weight:700;letter-spacing:0.3px;color:#fff;background:linear-gradient(135deg,#ff2e6e 0%,#a8004d 100%);box-shadow:0 8px 24px rgba(168,0,77,0.35);transition:transform 0.35s cubic-bezier(0.22,1,0.36,1),box-shadow 0.35s cubic-bezier(0.22,1,0.36,1),background 0.55s cubic-bezier(0.22,1,0.36,1),border-color 0.55s cubic-bezier(0.22,1,0.36,1);isolation:isolate;-webkit-tap-highlight-color:transparent;}
.btn-add-cart:hover{transform:translateY(-2px);box-shadow:0 14px 34px rgba(255,46,110,0.45);}
.btn-add-cart:active{transform:scale(0.97);transition-duration:0.1s;}
.btn-add-cart.added{background:linear-gradient(135deg,#1a0010 0%,#2a0020 100%);border:1px solid rgba(255,46,110,0.5);box-shadow:0 8px 24px rgba(168,0,77,0.15),inset 0 0 20px rgba(255,46,110,0.08);}
.btn-add-cart.just-added{animation:btnSuccessPulse 0.85s cubic-bezier(0.22,1,0.36,1);}
@keyframes btnSuccessPulse{0%{box-shadow:0 8px 24px rgba(168,0,77,0.35),0 0 0 0 rgba(255,46,110,0.5);}50%{box-shadow:0 8px 24px rgba(168,0,77,0.35),0 0 0 12px rgba(255,46,110,0);}100%{box-shadow:0 8px 24px rgba(168,0,77,0.35),0 0 0 0 rgba(255,46,110,0);}}
.cart-icon-stack{position:relative;width:18px;height:18px;display:inline-flex;align-items:center;justify-content:center;z-index:1;}
.cart-icon-stack svg{position:absolute;inset:0;width:100%;height:100%;transition:transform 0.6s cubic-bezier(0.68,-0.55,0.27,1.55),opacity 0.35s ease;stroke-width:2.2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;}
.cart-icon-cart{opacity:1;transform:scale(1) rotate(0deg);}
.cart-icon-check{opacity:0;transform:scale(0.2) rotate(-180deg);color:#ff2e6e;}
.btn-add-cart.added .cart-icon-cart{opacity:0;transform:scale(0.2) rotate(180deg);}
.btn-add-cart.added .cart-icon-check{opacity:1;transform:scale(1) rotate(0deg);color:#ff2e6e;}
.btn-cart-text{position:relative;z-index:1;}
.btn-ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,0.45);pointer-events:none;transform:scale(0);opacity:0.8;z-index:0;top:0;left:0;}
.btn-ripple.animate{animation:btnRipple 0.75s cubic-bezier(0.22,1,0.36,1);}
@keyframes btnRipple{0%{transform:scale(0);opacity:0.8;}100%{transform:scale(2.6);opacity:0;}}
.cart-wrap{margin:32px 0 24px;padding:36px;border-radius:26px;background:linear-gradient(180deg,rgba(30,0,16,0.5),rgba(15,0,8,0.7));border:1px solid rgba(255,255,255,0.06);}
.cart-notice{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:rgba(255,190,90,0.08);border:1px solid rgba(255,190,90,0.25);color:#ffd18a;font-size:13px;font-weight:500;line-height:1.5;margin-bottom:24px;}
.cart-notice-icon{font-size:18px;}
.cart-empty{text-align:center;padding:64px 24px;}
.cart-empty h3{font-size:28px;font-weight:900;letter-spacing:-0.6px;margin-bottom:12px;background:linear-gradient(135deg,#fff,rgba(255,255,255,0.55));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
.cart-empty p{color:var(--text-dim);font-size:14px;margin-bottom:24px;}
.btn-back{padding:12px 24px;border-radius:12px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;border:none;font-family:inherit;transition:all 0.25s;display:inline-block;cursor:pointer;}
.btn-back:hover{background:var(--accent-bright);transform:translateY(-2px);}
.cart-list{display:flex;flex-direction:column;gap:16px;}
.cart-item{display:grid;grid-template-columns:96px 1fr auto;gap:20px;padding:18px;border-radius:18px;background:rgba(255,255,255,0.025);border:1px solid rgba(255,255,255,0.05);align-items:center;animation:cartIn 0.4s ease;}
@keyframes cartIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}
.cart-item-img{width:96px;height:96px;border-radius:14px;background:radial-gradient(ellipse at center,rgba(168,0,77,0.15) 0%,transparent 70%);display:flex;align-items:center;justify-content:center;padding:8px;}
.cart-item-img img{max-width:100%;max-height:100%;object-fit:contain;}
.cart-item-body{display:flex;flex-direction:column;gap:6px;min-width:0;}
.cart-item-name{font-size:17px;font-weight:700;}
.cart-item-code{font-family:'SF Mono','Courier New',monospace;font-size:11px;color:var(--text-mute);letter-spacing:1.5px;}
.cart-item-config{font-size:12px;color:var(--text-mute);letter-spacing:0.2px;margin-top:2px;}
.cart-item-price{font-size:22px;font-weight:900;margin-top:4px;}
.cart-item-price small{font-size:13px;color:var(--text-dim);margin-left:4px;font-weight:600;}
.cart-item-actions{display:flex;flex-direction:column;gap:8px;align-items:stretch;}
.btn-cart-remove{padding:8px 14px;border-radius:10px;background:transparent;border:1px solid rgba(255,255,255,0.1);color:var(--text-dim);font-family:inherit;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s;}
.btn-cart-remove:hover{border-color:rgba(255,46,110,0.4);color:#ff8a8a;}
.cart-summary{margin-top:28px;padding-top:24px;border-top:1px solid rgba(255,255,255,0.08);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px;}
.cart-total{font-size:15px;color:var(--text-dim);font-weight:500;}
.cart-total strong{font-size:28px;color:#fff;font-weight:900;margin-left:10px;letter-spacing:-0.6px;text-shadow:0 0 24px rgba(255,46,110,0.35);}
.btn-cart-checkout{padding:16px 32px;border-radius:14px;border:none;background:linear-gradient(135deg,#ff2e6e,#a8004d);color:#fff;font-family:inherit;font-size:15px;font-weight:800;letter-spacing:0.4px;cursor:pointer;transition:transform 0.3s cubic-bezier(0.22,1,0.36,1),box-shadow 0.3s cubic-bezier(0.22,1,0.36,1);box-shadow:0 10px 28px rgba(168,0,77,0.4);}
.btn-cart-checkout:hover{transform:translateY(-2px);box-shadow:0 16px 40px rgba(255,46,110,0.5);}
.btn-cart-checkout:active{transform:scale(0.97);}
@media(max-width:700px){.cart-wrap{padding:22px 16px;}.cart-item{grid-template-columns:70px 1fr;gap:14px;}.cart-item-img{width:70px;height:70px;}.cart-item-actions{grid-column:1/-1;flex-direction:row;justify-content:flex-end;}.btn-cart-checkout{width:100%;}}

<body>
<div class="mayum-widget">

    <svg id="mayumClock" viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">

        <line id="secondHand" x1="200" y1="150" x2="200" y2="55" stroke="#ff0088" stroke-width="2" stroke-linecap="round"/>

var tc=document.getElementById('ticksContainer'),cx=200,cy=150,tr=85,tir=75;
for(var i=0;i<12;i++){var a=(i*30-90)*(Math.PI/180),ox=cx+tr*Math.cos(a),oy=cy+tr*Math.sin(a),ih=(i%3===0)?4:2,lo=(i%3===0)?5:0,ix=cx+(tir+lo)*Math.cos(a),iy=cy+(tir+lo)*Math.sin(a),ln=document.createElementNS("http://www.w3.org/2000/svg","line");ln.setAttribute('x1',ox);ln.setAttribute('y1',oy);ln.setAttribute('x2',ix);ln.setAttribute('y2',iy);ln.setAttribute('stroke','#fff');ln.setAttribute('stroke-width',ih);ln.setAttribute('stroke-linecap','round');tc.appendChild(ln)}

</body>

  function imgCandidates(primaryUrl){
    if (!primaryUrl) return [PLACEHOLDER_IMG];
    var list = [primaryUrl];
    try {
      var lastSlash = primaryUrl.lastIndexOf('/');
      var dir = primaryUrl.substring(0, lastSlash + 1);
      var name = primaryUrl.substring(lastSlash + 1);
      var rawName;
      try { rawName = decodeURIComponent(name); } catch(e){ rawName = name; }
      if (dir.indexOf(IMG_BASE) === 0){
        list.push(IMG_ROOT + name);
        list.push(IMG_ROOT + rawName);
      } else if (dir === IMG_ROOT){
        list.push(IMG_BASE + name);
        list.push(IMG_BASE + rawName);
      }
      if (rawName !== name) list.push(dir + rawName);
      if (rawName.toLowerCase() !== rawName) list.push(dir + encodeURIComponent(rawName.toLowerCase()));
    } catch(e){}
    var uniq = [], seen = {};
    list.forEach(function(u){ if (!seen[u]){ seen[u]=1; uniq.push(u); } });
    uniq.push(PLACEHOLDER_IMG);
    return uniq;
  }

  function setImgWithFallback(img, urls){
    var i = 0, finished = false;
    function next(){
      if (finished) return;
      if (i >= urls.length){
        finished = true;
        img.onerror = null;
        img.src = PLACEHOLDER_IMG;
        return;
      }
      img.src = urls[i++];
    }
    img.onerror = next;
    next();
  }

  function formatPrice(rub){ var c=CURRENCIES[currentCurrency]; var val=Math.round(rub*c.rate); var str=fmtNum(val); return c.before?c.symbol+str:str+' '+c.symbol; }
  function formatPriceHTML(rub){ var c=CURRENCIES[currentCurrency]; var val=Math.round(rub*c.rate); var str=fmtNum(val); return c.before?'<small>'+c.symbol+'</small>'+str:str+' <small>'+c.symbol+'</small>'; }
  function getPriceNote(p){ if (p.noMemory) return ''; var opts = p.memoryOpts || MEMORY_OPTS; return t('priceNote') + memGB(opts[0].gb); }
  function getMemoryOpts(item){ return item.memoryOpts || MEMORY_OPTS; }
  function getProductKey(p){ return p.code || p.name; }
  function isInCart(key){ for(var i=0;i<cart.length;i++){if(cart[i].key===key)return true;}return false; }
  function widgetHTML(id){ var tpl=document.getElementById('src-'+id); return tpl?tpl.innerHTML:''; }
  function makeFrame(srcId, cssClass){
    var f=document.createElement('iframe');
    f.className='embed '+cssClass;
    f.setAttribute('loading','lazy');
    var html = widgetHTML(srcId);
    html = html.replace(/<head>/, '<head><scr'+'ipt>window.__MRS_LANG__="'+currentLang+'";</scr'+'ipt>');
    f.srcdoc = html;
    return f;
  }

  function addToCart(p){
    if (p.notForSale) return;
    var key = getProductKey(p);
    if (isInCart(key)) return;
    cart.push({ key:key, name:p.name, code:p.code||'', price:p.price, img:p.img||null, noMemory:!!p.noMemory, memoryOpts:p.memoryOpts||null, specs:p.specs, config:{ memoryIdx:0, colorValue:COLORS[0].v, colorName:COLORS[0].n } });
    updateNavCart();
  }
  function removeFromCart(key){ for(var i=0;i<cart.length;i++){ if(cart[i].key===key){ cart.splice(i,1); break; } } updateNavCart(); }
  function itemPrice(item){ if (item.noMemory) return item.price; var opt = getMemoryOpts(item)[item.config.memoryIdx]; return item.price + (opt ? opt.extra : 0); }
  function cartTotal(){ return cart.reduce(function(s,item){ return s + itemPrice(item); },0); }

  function updateNavCart(){
    var btn = document.querySelector('nav button[data-target="cart"]');
    if (!btn) return;
    if (cart.length) { btn.textContent = t('cartWithCount')(cart.length); btn.classList.add('has-items'); }
    else { btn.textContent = t('cart'); btn.classList.remove('has-items'); }
  }

  function createRipple(btn, e){
    var rect = btn.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height);
    var ripple = document.createElement('span');
    ripple.className = 'btn-ripple animate';
    ripple.style.width = size + 'px';
    ripple.style.height = size + 'px';
    var xy = {x: (e.touches && e.touches[0]) ? e.touches[0].clientX : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientX : e.clientX, y: (e.touches && e.touches[0]) ? e.touches[0].clientY : (e.changedTouches && e.changedTouches[0]) ? e.changedTouches[0].clientY : e.clientY};
    ripple.style.left = (xy.x - rect.left - size/2) + 'px';
    ripple.style.top = (xy.y - rect.top - size/2) + 'px';
    btn.appendChild(ripple);
    setTimeout(function(){ if(ripple.parentNode) ripple.parentNode.removeChild(ripple); }, 800);
  }

  function createAddButton(p){
    var key = getProductKey(p);
    var inCart = isInCart(key);
    var btn = document.createElement('button');
    btn.className = 'btn-add-cart' + (inCart ? ' added' : '');
    btn.dataset.code = key;
    btn.innerHTML = '<span class="cart-icon-stack"><svg class="cart-icon-cart" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg><svg class="cart-icon-check" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg></span><span class="btn-cart-text">' + (inCart ? t('toCheckout') : t('addToCart')) + '</span>';
    btn.addEventListener('click', function(e){
      if (!btn.classList.contains('added')){
        createRipple(btn, e);
        setTimeout(function(){
          addToCart(p);
          btn.classList.add('added','just-added');
          btn.querySelector('.btn-cart-text').textContent = t('toCheckout');
          setTimeout(function(){ btn.classList.remove('just-added'); }, 900);
        }, 180);
      } else { showPage('cart'); }
    });
    return btn;
  }

  function createProductCard(p, i){
    var card = document.createElement('article');
    card.className = 'ms-product' + (p.notForSale ? ' not-for-sale' : '');
    card.style.animationDelay = (i*0.06)+'s';
    var specsHTML = p.specs.map(function(s){ return '<div><dt>'+translateSpecKey(s[0])+'</dt><dd>'+translateSpecValue(s[1])+'</dd></div>'; }).join('');
    var codeHTML = p.code ? '<span class="ms-product-code">'+p.code+'</span>' : '';
    var noteText = p.notForSale ? '' : getPriceNote(p);
    var noteHTML = noteText ? '<span class="ms-product-price-note">'+noteText+'</span>' : '';
    var badgeHTML = p.notForSale
      ? '<span class="ms-product-badge">'+t('notForSale')+'</span>'
      : (p.noNewOS ? '<span class="ms-product-badge">'+t('noNewOS')+'</span>' : '');
    var priceHTML = p.notForSale
      ? '<div class="ms-product-price disabled">'+t('notForSale')+'</div>'
      : '<div class="ms-product-price">'+formatPriceHTML(p.price)+noteHTML+'</div>';
    card.innerHTML = '<div class="ms-product-image"></div><div class="ms-product-body"><div class="ms-product-head"><span class="ms-product-name">'+p.name+'</span>'+codeHTML+'</div>'+badgeHTML+priceHTML+'<details class="ms-product-specs"><summary>'+t('specs')+'</summary><dl>'+specsHTML+'</dl></details></div>';
    var imageDiv = card.querySelector('.ms-product-image');
    var img = document.createElement('img');
    img.alt = p.name;
    // MyPK+ (notForSale без img) — сразу заглушка. Остальные — обычная загрузка
    if (p.notForSale || !p.img) {
      img.src = PLACEHOLDER_IMG;
    } else {
      setImgWithFallback(img, imgCandidates(fixImgUrl(p.img)));
    }
    imageDiv.appendChild(img);
    if (!p.notForSale) {
      card.querySelector('.ms-product-body').appendChild(createAddButton(p));
    }
    return card;
  }

  function renderProductSection(pageId){
    var cfg = PAGE_PRODUCTS[pageId];
    if (!cfg) return null;
    var sec = document.createElement('section');
    sec.className = 'products-section';
    var saleable = cfg.data.filter(function(p){ return !p.notForSale; });
    var minPrice = (saleable.length ? saleable : cfg.data).reduce(function(m,p){ return p.price<m?p.price:m; }, (saleable[0]||cfg.data[0]).price);
    var eyebrow = cfg.eyebrow[currentLang] || cfg.eyebrow.ru;
    var title = cfg.title[currentLang] || cfg.title.ru;
    var head = document.createElement('div');
    head.className = 'products-head';
    head.innerHTML = '<div><span class="products-eyebrow">'+eyebrow+'</span><h2>'+title+'</h2></div><div class="products-meta"><span>'+cfg.data.length+' '+t('models')+'</span><span>'+t('from')+' '+formatPrice(minPrice)+'</span></div>';
    sec.appendChild(head);
    var grid = document.createElement('div');
    grid.className = 'products-grid-ms';
    cfg.data.forEach(function(p,i){ grid.appendChild(createProductCard(p,i)); });
    sec.appendChild(grid);
    return sec;

        var itemEl = container.querySelector('.co-item[data-idx="'+idx+'"] .co-item-price');
        if (itemEl) itemEl.innerHTML = formatPriceHTML(itemPrice(cart[idx]));
        var totEl = container.querySelector('#co-total');
        if (totEl) totEl.textContent = formatPrice(cartTotal());
      });
    });
    container.querySelectorAll('.co-color-swatch').forEach(function(sw){
      sw.addEventListener('click', function(){
        var idx = parseInt(sw.dataset.item,10);
        var group = sw.parentElement;
        group.querySelectorAll('.co-color-swatch').forEach(function(s){ s.classList.remove('selected'); });
        var custom = group.querySelector('.co-color-custom');
        if (custom) custom.classList.remove('selected');
        sw.classList.add('selected');
        cart[idx].config.colorValue = sw.dataset.color;
        cart[idx].config.colorName = sw.dataset.name;
        var chosen = container.querySelector('[data-chosen="'+idx+'"]');
        if (chosen) chosen.textContent = sw.dataset.name;
      });
    });
    container.querySelectorAll('.co-color-input').forEach(function(inp){
      inp.addEventListener('input', function(){
        var idx = parseInt(inp.dataset.item,10);
        var group = inp.closest('.co-color-options');
        group.querySelectorAll('.co-color-swatch').forEach(function(s){ s.classList.remove('selected'); });
        var custom = group.querySelector('.co-color-custom');
        if (custom) custom.classList.add('selected');
        cart[idx].config.colorValue = inp.value;
        cart[idx].config.colorName = inp.value.toUpperCase();
        var chosen = container.querySelector('[data-chosen="'+idx+'"]');
        if (chosen) chosen.textContent = cart[idx].config.colorName;
      });
    });
    var consentWrap = container.querySelector('#consent-wrap');
    var consentInp = container.querySelector('#f-consent');
    var btnBuy = container.querySelector('#btn-buy');
    consentInp.addEventListener('change', function(){
      consentWrap.classList.toggle('checked', consentInp.checked);
      btnBuy.disabled = !consentInp.checked;
    });
    container.querySelector('#co-form').addEventListener('submit', function(e){
      e.preventDefault();
      if (!consentInp.checked) return;
      var email = container.querySelector('#f-email').value.trim();
      var city = container.querySelector('#f-city').value.trim();
      var street = container.querySelector('#f-street').value.trim();
      var house = container.querySelector('#f-house').value.trim();
      var postal = container.querySelector('#f-postal').value.trim();
      if (!email || !city || !street || !house){ alert(t('fillRequired')); return; }
      btnBuy.classList.add('loading');
      btnBuy.textContent = t('sending');
      var lines = cart.map(function(item){
        var memInfo;
        if (item.noMemory) memInfo = '—';
        else {
          var opt = getMemoryOpts(item)[item.config.memoryIdx];
          memInfo = memGB(opt.gb)+' / '+memRAM(opt.ram)+' RAM';
        }
        var nameWithCode = item.code ? item.name+' ['+item.code+']' : item.name;
        return '• '+nameWithCode+' — '+memInfo+', '+t('colorValueUnit')+' '+item.config.colorName+' ('+item.config.colorValue+') — '+formatPrice(itemPrice(item));
      }).join('\n');
      var data = {
        _subject:(currentLang==='en'?'New order: ':'Новый заказ: ')+cart.length+' '+(currentLang==='en'?'item(s)':'тов.'),
        'Состав заказа':lines,
        'Итого (RUB)':fmtNum(cartTotal())+' ₽',
        'Валюта клиента':currentCurrency,
        'Язык клиента':currentLang,
        'Email клиента':email,
        'Город':city, 'Улица':street, 'Дом':house, 'Индекс':postal||'—',
        'Согласие на сбор данных':'Да'
      };
      fetch(FORMSPREE,{ method:'POST', headers:{'Content-Type':'application/json','Accept':'application/json'}, body:JSON.stringify(data) })
      .then(function(res){ if (!res.ok) throw new Error('HTTP '+res.status); cart.length = 0; updateNavCart(); renderCartContent(); showSuccessMulti(); })
      .catch(function(err){ btnBuy.classList.remove('loading'); btnBuy.textContent = t('buyAllBtn'); alert(t('errorSend')+'\n\n'+err.message); });
    });
  }

  function showSuccessMulti(){
    var container = document.getElementById('checkout-content');
    container.innerHTML = '<div class="success-card"><div class="success-icon">✓</div><h2>'+t('orderPlaced')+'</h2><p>'+t('orderPlacedDesc')+'</p><button class="btn-back" data-action="goto-mysee">'+t('backToStore')+'</button></div>';
    container.querySelector('[data-action="goto-mysee"]').addEventListener('click', function(){ hideModal(); showPage('mysee'); });
  }

  function buildApp(){
    navEl = document.getElementById('nav');
    mainEl = document.getElementById('main');
    if (!navEl || !mainEl) return;
    navEl.innerHTML = '';
    mainEl.innerHTML = '';
    PAGES.forEach(function(p){
      var btn = document.createElement('button');
      var titleText = p.id === 'cart' ? t('cart') : p.title;
      btn.textContent = titleText;
      btn.dataset.target = p.id;
      if (p.id==='cart') btn.classList.add('cart-btn');
      btn.addEventListener('click', function(){ showPage(p.id); });
      navEl.appendChild(btn);
      var sec = document.createElement('section');
      sec.className = 'page';
      sec.id = 'page-'+p.id;
      var h = document.createElement('h1'); h.className = 'page-title'; h.textContent = p.title; sec.appendChild(h);
      var sub = document.createElement('p'); sub.className = 'page-sub'; sub.textContent = (p.sub[currentLang] || p.sub.ru); sec.appendChild(sub);
      if (p.id==='cart'){
        var wrap = document.createElement('div'); wrap.id = 'cart-content'; sec.appendChild(wrap);
      } else {
        sec.appendChild(makeFrame('news','embed-news'));
        sec.appendChild(makeFrame('train','embed-train'));
        sec.appendChild(makeFrame('runway','embed-runway'));
        sec.appendChild(makeFrame('clock','embed-clock'));
        sec.appendChild(makeFrame('ai','embed-ai'));
        if (PAGE_PRODUCTS[p.id]){ var ps = renderProductSection(p.id); if (ps) sec.appendChild(ps); }
        if (p.id==='mysee'){
          var row = document.createElement('div');
          row.className = 'widgets-row';
          row.appendChild(makeFrame('mau','embed-os'));
          row.appendChild(makeFrame('m15y','embed-os'));
          row.appendChild(makeFrame('mtv','embed-os'));
          row.appendChild(makeFrame('my','embed-os'));
          sec.appendChild(row);
        }
        sec.appendChild(makeFrame('clock','embed-clock'));
        sec.appendChild(makeFrame('train','embed-train'));
        if (p.noProducts || (!PAGE_PRODUCTS[p.id])) {
          var cs = document.createElement('div');
          cs.className = 'coming-soon';
          cs.innerHTML = '<h2>'+t('comingSoon')+'</h2><p class="game-note">'+t('gameNote')+'</p>';
          sec.appendChild(cs);
        }
      }
      var foot = document.createElement('footer');
      foot.className = 'disclaimer';
      foot.innerHTML = t('footer1')+'<strong>"Mayskiy Runway"</strong>'+t('footer2')+'<br>'+t('footerDelivery')+'<br><strong>'+t('footerCompanies')+'</strong>';
      sec.appendChild(foot);
      mainEl.appendChild(sec);
    });
    updateNavCart();
  }

  function showPage(id){
    var allPages = document.querySelectorAll('.page');
    var allBtns = document.querySelectorAll('nav button');
    allPages.forEach(function(el){ el.classList.remove('active'); });
    allBtns.forEach(function(el){ el.classList.remove('active'); });
    var page = document.getElementById('page-'+id);
    var btn = document.querySelector('nav button[data-target="'+id+'"]');
    if (!page) return;
    if (id==='cart') renderCartContent();
    page.classList.add('active');
    if (btn) btn.classList.add('active');
    if (document.body.classList.contains('iface-mobile')) navEl.classList.remove('open');
    window.scrollTo({top:0,behavior:'smooth'});
  }

  // ===== ПРЕЛОАДЕР =====
  var preloader = document.getElementById('preloader');
  var barEl = preloader.querySelector('.preloader-bar');
  var pctEl = preloader.querySelector('.preloader-percent');
  var settingsScreen = document.getElementById('settings-screen');
  var mainApp = document.getElementById('main-app');
  var isFirstVisit = true;

  try {
    var saved = JSON.parse(localStorage.getItem('mrs_settings') || 'null');
    if (saved){ currentLang = saved.lang || 'ru'; currentCurrency = saved.currency || 'RUB'; currentIface = saved.iface || 'auto'; isFirstVisit = false; }
  } catch(e){ console.warn('[MYRUNSTORE] read failed:', e); }

  function collectImageUrls(){
    var urls = new Set();
    urls.add('https://raw.githubusercontent.com/balovzena9-ops/mayrunwaystore/main/%D1%84%D0%BE%D1%82%D0%BE%20%D0%BC%D0%B0%D0%B9%D1%81%D0%B8/myry.jpg');
    Object.keys(PAGE_PRODUCTS).forEach(function(k){
      PAGE_PRODUCTS[k].data.forEach(function(p){
        if (p.img && !p.notForSale){ urls.add(fixImgUrl(p.img)); }
      });
    });
    return Array.from(urls);
  }

  var imageUrls = collectImageUrls();
  var totalImgs = imageUrls.length;
  var progress = 0;
  var minProgress = 0;

  function setProgress(p){
    if (p < minProgress) p = minProgress;
    progress = Math.min(100, p);
    barEl.style.width = progress + '%';
    pctEl.textContent = Math.round(progress) + '%';
  }

  function preloadImages(){
    return new Promise(function(resolve){
      if (!totalImgs){ resolve(); return; }
      var done = 0;
      var resolved = false;
      function finish(){ if (!resolved){ resolved = true; resolve(); } }
      imageUrls.forEach(function(url){
        var img = new Image();
        img.onload = img.onerror = function(){
          done++;
          var pct = Math.floor((done / totalImgs) * 100);
          setProgress(Math.min(95, pct));
          if (done === totalImgs) finish();
        };
        img.src = url;
      });
      setTimeout(finish, 15000);
    });
  }

  var fakeProgressTimer = setInterval(function(){
    if (progress < 90) { minProgress = Math.min(90, minProgress + 3); setProgress(minProgress); }
  }, 150);

  preloadImages().then(function(){
    clearInterval(fakeProgressTimer);
    setProgress(100);
    setTimeout(afterPreloader, 500);
  });

  setTimeout(function(){
    if (preloader && !preloader.classList.contains('hidden')){
      console.warn('[MYRUNSTORE] preloader forced');
      clearInterval(fakeProgressTimer);
      setProgress(100);
      afterPreloader();
    }
  }, 15000);

  function afterPreloader(){
    preloader.classList.add('hidden');
    if (isFirstVisit){ openSettings(false); } else { startApp(); }
  }
  function startApp(){ mainApp.style.display = ''; buildApp(); showPage('mysee'); }
  function rebuildApp(){ mainApp.style.display = ''; buildApp(); showPage('mysee'); }

  // ===== НАСТРОЙКИ =====
  var settingsTitle = document.getElementById('settings-title');
  var settingsSub = document.getElementById('settings-sub');
  var settingsLangLabel = document.getElementById('settings-lang-label');
  var settingsCurrencyLabel = document.getElementById('settings-currency-label');
  var settingsIfaceLabel = document.getElementById('settings-iface-label');
  var settingsContinue = document.getElementById('settings-continue');

  function updateSettingsTexts(){
    if (currentLang === 'en'){
      settingsTitle.textContent = 'Welcome';
      settingsSub.textContent = 'Set up language, currency & interface';
      settingsLangLabel.textContent = 'Language';
      settingsCurrencyLabel.textContent = 'Currency';
      settingsIfaceLabel.textContent = 'Interface';
      settingsContinue.textContent = 'Continue';
      document.getElementById('iface-auto').textContent = 'Auto';
      document.getElementById('iface-desktop').textContent = 'PC';
      document.getElementById('iface-mobile').textContent = 'Mobile';
    } else {
      settingsTitle.textContent = 'Добро пожаловать';
      settingsSub.textContent = 'Настройте язык, валюту и интерфейс';
      settingsLangLabel.textContent = 'Язык';
      settingsCurrencyLabel.textContent = 'Валюта';
      settingsIfaceLabel.textContent = 'Интерфейс';
      settingsContinue.textContent = 'Продолжить';
      document.getElementById('iface-auto').textContent = 'Авто';
      document.getElementById('iface-desktop').textContent = 'ПК';
      document.getElementById('iface-mobile').textContent = 'Моб.';
    }
  }

  function updateSettingsUI(){
    settingsScreen.querySelectorAll('[data-lang]').forEach(function(b){ b.classList.toggle('selected', b.dataset.lang === currentLang); });
    settingsScreen.querySelectorAll('[data-currency]').forEach(function(b){ b.classList.toggle('selected', b.dataset.currency === currentCurrency); });
    settingsScreen.querySelectorAll('[data-iface]').forEach(function(b){ b.classList.toggle('selected', b.dataset.iface === currentIface); });
    updateSettingsTexts();
  }

  settingsScreen.querySelectorAll('[data-lang]').forEach(function(b){
    b.addEventListener('click', function(){ currentLang = b.dataset.lang; updateSettingsUI(); });
  });
  settingsScreen.querySelectorAll('[data-currency]').forEach(function(b){
    b.addEventListener('click', function(){ currentCurrency = b.dataset.currency; updateSettingsUI(); });
  });
  settingsScreen.querySelectorAll('[data-iface]').forEach(function(b){
    b.addEventListener('click', function(){ currentIface = b.dataset.iface; updateSettingsUI(); });
  });

  function applyIface(){
    var isMobile;
    if (currentIface === 'mobile') isMobile = true;
    else if (currentIface === 'desktop') isMobile = false;
    else isMobile = window.matchMedia('(max-width: 900px)').matches;
    document.body.classList.toggle('iface-mobile', isMobile);
    if (!isMobile && navEl) navEl.classList.remove('open');
  }
  window.addEventListener('resize', function(){ if (currentIface === 'auto') applyIface(); });

  function openSettings(fromHeader){ updateSettingsUI(); settingsScreen.classList.add('visible'); settingsScreen.dataset.fromHeader = fromHeader ? '1' : '0'; }
  function closeSettings(){ settingsScreen.classList.remove('visible'); }

  settingsContinue.addEventListener('click', function(){
    try { localStorage.setItem('mrs_settings', JSON.stringify({ lang: currentLang, currency: currentCurrency, iface: currentIface })); }
    catch(e){ console.warn('[MYRUNSTORE] write failed:', e); }
    var fromHeader = settingsScreen.dataset.fromHeader === '1';
    closeSettings();
    applyIface();
    if (isFirstVisit){ isFirstVisit = false; startApp(); }
    else if (fromHeader){ rebuildApp(); }
  });

  var settingsBtn = document.getElementById('settings-btn');
  if (settingsBtn) settingsBtn.addEventListener('click', function(){ openSettings(true); });

  var brandToggle = document.getElementById('brand-toggle');
  if (brandToggle) brandToggle.addEventListener('click', function(){
    if (document.body.classList.contains('iface-mobile') && navEl) {
      navEl.classList.toggle('open');
    }
  });

  applyIface();
})();
</script>

<script>
document.addEventListener("DOMContentLoaded", function() {
    if (typeof vkBridge !== 'undefined') {
        vkBridge.send('VKWebAppInit').then(function(data){ if (data.result) console.log("VK Bridge запущен!"); })
        .catch(function(error){ console.error("VK Bridge ошибка:", error); });
    } else { console.error("Библиотека VK Bridge не найдена!"); }
});
</script>
